name: Build, Test & Publish

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish:
    name: Publish to npm
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Update npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@11

      - name: Bump patch version (main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ] && [ "$(node -p "require('./$pkg/package.json').private === true")" != "true" ]; then
              npm version patch --workspace "$pkg" --no-git-tag-version
            fi
          done
          if ! git diff --quiet; then
            git commit -am "chore(release): publish packages [skip ci]"
            git tag "release-$(date +%Y%m%d%H%M%S)"
          fi

      - name: Push version bump
        if: github.ref == 'refs/heads/main'
        run: git push origin HEAD:main --follow-tags

      - name: Build
        run: npm run build

      - name: Publish release versions (main)
        if: github.ref == 'refs/heads/main'
        run: |
          for pkg in packages/*; do
            if [ ! -f "$pkg/package.json" ] || [ "$(node -p "require('./$pkg/package.json').private === true")" == "true" ]; then
              continue
            fi
            PKG_NAME=$(node -p "require('./$pkg/package.json').name")
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
              echo "Version $PKG_VERSION of $PKG_NAME is already published. Skipping."
            else
              npm publish --workspace "$pkg" --tag latest --provenance --access public
            fi
          done

      - name: Publish dev versions (other branches)
        if: github.ref != 'refs/heads/main'
        run: |
          for pkg in packages/*; do
            if [ ! -f "$pkg/package.json" ] || [ "$(node -p "require('./$pkg/package.json').private === true")" == "true" ]; then
              continue
            fi
            BASE_VERSION=$(node -p "require('./$pkg/package.json').version.split('-')[0]")
            DEV_VERSION="${BASE_VERSION}-dev.${{ github.run_number }}"
            npm version "$DEV_VERSION" --workspace "$pkg" --no-git-tag-version --allow-same-version
            npm publish --workspace "$pkg" --tag dev --provenance --access public
          done
